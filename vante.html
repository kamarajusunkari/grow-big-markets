<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vante — Services in Motion | Grow Big Marketers</title>
  <meta name="description" content="A performance marketing studio portfolio where a continuous 3D ribbon of our core services sweeps through space, then lands in a calm 3x2 grid.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }

  <style>
    :root {
      --bg: #fefce8;
      --ink: #0f172a;
      --mid: #64748b;
      --line: rgba(234, 179, 8, .35);
      --accent: #FDD00B;
      --brand-blue: #3d6ab3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    #track {
      height: 500vh;
      background: radial-gradient(circle at 85% 18%, rgba(253, 208, 11, 0.22) 0%, transparent 55%),
                  radial-gradient(circle at 12% 82%, rgba(254, 240, 138, 0.28) 0%, transparent 60%),
                  linear-gradient(180deg, #f8fafc 0%, #fefce8 10%, #fffbeb 50%, #fefce8 90%, #f8fafc 100%);
    }
    .stage {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: radial-gradient(circle at 85% 20%, rgba(253, 208, 11, 0.20) 0%, transparent 52%),
                  radial-gradient(circle at 10% 80%, rgba(254, 240, 138, 0.25) 0%, transparent 58%),
                  linear-gradient(180deg, #f8fafc 0%, #fefce8 12%, #fffbeb 50%, #fefce8 88%, #f8fafc 100%);
    }
    .hl {
      position: absolute;
      left: 0;
      right: 0;
      font-weight: 500;
      font-size: clamp(38px, 6.2vw, 110px);
      line-height: 1;
      letter-spacing: -.05em;
      white-space: nowrap;
      text-align: center;
      will-change: transform;
      user-select: none;
      color: var(--ink);
    }
    #l1 { top: calc(28% - .95em); }
    #l2 { top: calc(28% + .05em); }
    #l1 span, #l2 span { display: inline-block; }
    #l1 span { margin-right: 15vw; }
    #l2 span { margin-left: 15vw; }
    #cap {
      position: absolute;
      left: 50%;
      top: 28%;
      transform: translate(-50%, -50%);
      width: 22em;
      text-align: center;
      font-size: clamp(10px, .8vw, 14px);
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--mid);
      user-select: none;
    }
    #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #rule {
      position: absolute;
      left: 3.5vw;
      right: 3.5vw;
      top: 48%;
      height: 1px;
      background: var(--line);
      transform-origin: left;
      transform: scaleX(0);
      pointer-events: none;
    }

    @media (max-width: 768px) {
      #track { height: 220vh; }
      .hl {
        font-size: clamp(48px, 13vw, 76px);
        line-height: 0.94;
        letter-spacing: -0.04em;
      }
      #l1 { top: calc(20% - 0.92em); }
      #l2 { top: calc(20% + 0.08em); }
      #l1 span { margin-right: 8vw; }
      #l2 span { margin-left: 8vw; }
      #cap {
        top: 20%;
        width: 84%;
        max-width: 310px;
        font-size: 11px;
        line-height: 1.35;
      }
    }
    #name {
      position: absolute;
      left: 0;
      top: 0;
      padding: 8px 16px;
      background: var(--ink);
      color: #ffffff;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      pointer-events: none;
      opacity: 0;
      transition: opacity .16s;
      white-space: nowrap;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }
    #name .name-metric {
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
    }

    /* Modal for Service Card Click */
    #serviceModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .55);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: none;
      place-items: center;
      padding: 24px;
      opacity: 0;
      transition: opacity .25s ease;
    }
    #serviceModal.open {
      display: grid;
      opacity: 1;
    }
    .modal-box {
      background: #ffffff;
      border: 1px solid rgba(234, 179, 8, .45);
      border-radius: 24px;
      max-width: 620px;
      width: 100%;
      padding: 36px;
      position: relative;
      color: var(--ink);
      box-shadow: 0 25px 70px rgba(0,0,0,.18), 0 0 35px rgba(253, 208, 11, .15);
    }
    .modal-close {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(15, 23, 42, .15);
      background: rgba(15, 23, 42, .04);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 16px;
      cursor: pointer;
      transition: all .2s;
    }
    .modal-close:hover {
      background: var(--ink);
      color: #ffffff;
    }
    .modal-tag {
      font: 700 11.5px 'IBM Plex Mono', monospace;
      letter-spacing: .12em;
      color: #d97706;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .modal-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 14.5px;
      color: var(--mid);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .modal-deliverables {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }
    .modal-deliverable-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #334155;
    }
    .modal-deliverable-item:before {
      content: "✓";
      color: #d97706;
      font-weight: bold;
    }
    .modal-btn {
      width: 100%;
      height: 50px;
      background: var(--accent);
      color: var(--ink);
      border: 1px solid rgba(234, 179, 8, .6);
      border-radius: 99px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: .02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(253, 208, 11, .35);
      transition: transform .2s, filter .2s;
    }
    .modal-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
    }

    @media (max-width: 760px) {
      .modal-deliverables { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="track">
  <main class="stage" id="stage">
    <h1 aria-label="Services in motion">
      <div class="hl" id="l1" aria-hidden="true"><span>SERVICES IN</span></div>
      <div class="hl" id="l2" aria-hidden="true"><span>MOTION</span></div>

    <div id="cap">Data-driven performance marketing engineered to scale revenue.</div>
    <div id="rule"></div>
    <canvas id="gl"></canvas>
    <div id="name"></div>
  </main>
</div>

<!-- Interactive Modal for Services -->
<div id="serviceModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-tag" id="modalTag">PAID MEDIA & PPC</div>
    <h3 class="modal-title" id="modalTitle">Performance Marketing</h3>
    <p class="modal-desc" id="modalDesc"></p>
    <div class="modal-deliverables" id="modalDeliverables"></div>
    <button class="modal-btn" id="modalActionBtn">Book Strategy Call →</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const SERVICES = [
  {
    title: 'Performance Marketing',
    category: 'PAID MEDIA & PPC',
    metric: '4.8x Avg ROAS',
    desc: 'High-converting ad campaigns across Google Search, Meta (Instagram & Facebook), YouTube & LinkedIn engineered to maximize ROAS.',
    image: '/bdb38855-3775-42ba-8d23-f32c41f2e827.webp',
    deliverables: ['Google Search & Shopping Ads', 'Meta Ads Scaling', 'High ROAS Campaign Scaling', 'Precision Retargeting Funnels']
  },
  {
    title: 'Search Engine Optimization',
    category: 'ORGANIC SEO & RANKINGS',
    metric: '#1 Google Rankings',
    desc: 'Propel your brand to the top of Google results with technical SEO audits, high-authority backlink building, and intent keywords.',
    image: '/679b7310-0afd-42d1-953b-94209bbf2c6f.png',
    deliverables: ['Technical & On-Page SEO Audits', 'High-Intent Keyword Strategy', 'Local Business & Maps SEO', 'Authority Link Building']
  },
  {
    title: 'Social Media & Viral Reels',
    category: 'BRANDING & CONTENT',
    metric: '10M+ Video Views',
    desc: 'Build authentic brand authority and active community engagement through viral short-form video reels and strategic content calendars.',
    image: '/158bb487-34c7-4e8d-a53f-b72845659451.webp',
    deliverables: ['Reels & Video Content Creation', 'Brand Authority Strategy', 'Active DM & Community Growth', 'Influencer Partnerships']
  },
  {
    title: 'Conversion Optimization (CRO)',
    category: 'CRO & SALES FUNNELS',
    metric: '+185% Conversion Rate',
    desc: 'Turn website traffic into paying loyal customers through conversion-focused landing page design, A/B split testing & behavior audits.',
    image: '/who we are.webp',
    deliverables: ['High-Converting Landing Pages', 'A/B Split Testing & Analytics', 'Lead Capture Form Funnels', 'Heatmap & Behavior Audits']
  },
  {
    title: 'Lead Generation Architecture',
    category: 'B2B & HIGH-TICKET LEADS',
    metric: '500+ Qualified Leads/Mo',
    desc: 'Automate qualified lead pipelines with multi-touch capture funnels, CRM routing, and automated email nurturing sequences.',
    image: '/about (1).webp',
    deliverables: ['Multi-Channel Lead Capture', 'Automated Lead Nurturing', 'High-Converting Copywriting', 'CRM & Zapier Sync']
  },
  {
    title: 'E-Commerce Revenue Scaling',
    category: 'D2C & RETAIL EXPANSION',
    metric: '3.5x DTC Revenue Growth',
    desc: 'Scale monthly revenue with omni-channel product catalog ads, retention funnels, and average order value (AOV) optimization.',
    image: '/fa443696-1d06-450a-b4f8-fa075413fcb4.png',
    deliverables: ['Catalog & Shopping Ads', 'Retention & Email Marketing', 'AOV & Cart Optimization', 'Omnichannel Attribution']
  },
  {
    title: 'Brand Strategy & Creative',
    category: 'IDENTITY & AD ASSETS',
    metric: 'Creative That Converts',
    desc: 'High-impact video ad creatives, brand positioning, and compelling visual identity systems that separate you from competitors.',
    image: '/b07d4f71-917c-41bd-a83c-f49aa02656c4.png',
    deliverables: ['Video Ad Production', 'Visual Identity Design', 'Conversion Ad Creatives', 'Brand Positioning Guides']
  },
  {
    title: 'Local Google Maps Dominance',
    category: 'LOCAL 3-PACK SEO',
    metric: 'Top 3 Local Placement',
    desc: 'Hyper-targeted local search ranking strategies, Google Business Profile optimization, and local citation dominance.',
    image: '/7ef1db20-08b4-46ed-a211-22df5c97117d.png',
    deliverables: ['Google Business Profile Optimization', 'Local Citation Building', 'Geo-Targeted Landing Pages', 'Review Generation Systems']
  }
];

const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const out = t => 1 - (1 - t) ** 3;
const span = (p, a, b) => clamp((p - a) / (b - a));

/* ---------- renderer ---------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setClearColor(0, 0);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const scene = new THREE.Scene();
const FOV = 35, camera = new THREE.PerspectiveCamera(FOV, 1, .1, 100);

/* ---------- ribbon path ---------- */
let path, PATH_L = 1;
const SAMPLES = 1200, pathP = [], pathT = [];
const PH0 = -1.5, PH1 = Math.PI * 2 + 1.35;
function buildPath() {
  const pts = [];
  const isMob = innerWidth < 768;
  const depthScale = isMob ? 0.88 : 1.0;
  const xFactor = isMob ? 0.36 : 0.561;
  const yFactor = isMob ? 0.44 : 0.63;
  for (let i = 0; i <= 160; i++) {
    const t = i / 160, ph = mix(PH0, PH1, t), cs = Math.cos(ph), u = 2 * t - 1;
    const depth = (cs > 0 ? 7.6 + 16.4 * cs ** .9 : 7.6 + 2.2 * cs) * depthScale;
    const edge = (isMob ? 0.65 : 0.84) + 0.5 * span(0.14 - t, 0, 0.14) + 0.8 * span(t, 0.84, 1);
    pts.push(new THREE.Vector3(edge * Math.sin(ph) * depth * xFactor, 0.5 * Math.sign(u) * Math.abs(u) ** 1.4 * depth * yFactor, -depth));
  }
  path = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  path.arcLengthDivisions = 1500;
  PATH_L = path.getLength(); pathP.length = pathT.length = 0;
  for (let i = 0; i <= SAMPLES; i++) { const u = i / SAMPLES; pathP.push(path.getPointAt(u)); pathT.push(path.getTangentAt(u)); }
}
const at = (s, op, ot) => {
  const f = clamp(s / PATH_L) * SAMPLES, i = Math.min(SAMPLES - 1, Math.floor(f)), k = f - i;
  op.lerpVectors(pathP[i], pathP[i + 1], k); ot.lerpVectors(pathT[i], pathT[i + 1], k).normalize();
};

/* ---------- cards & canvas textures ---------- */
const CARD_W = 2.1, CARD_H = 1.32, GAP = .03, STEP = CARD_W + GAP, NX = 28, NY = 3;
const vs = `varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const fs = `uniform sampler2D map;uniform vec2 cover;uniform float aspect,ready,radius;varying vec2 vUv;
void main(){
  vec2 q=(abs(vUv-.5)-.5)*vec2(aspect,1.)+radius;
  float d=length(max(q,0.))+min(max(q.x,q.y),0.)-radius;
  float px=fwidth(d),a=1.-smoothstep(-px,px,d);
  if(a<.01)discard;
  vec2 uv=vUv;if(!gl_FrontFacing)uv.x=1.-uv.x;
  vec3 c=mix(vec3(0.98, 0.97, 0.92),texture2D(map,(uv-.5)*cover+.5).rgb,ready);
  float edge=smoothstep(-.014-px,-.014,d);
  gl_FragColor=vec4(mix(c,vec3(0.99, 0.82, 0.04),edge*.35),a);
}`;

function drawServiceCardCanvas(ctx, img, item) {
  const W = 1400, H = 880;
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    const ia = img.naturalWidth / img.naturalHeight, ta = W / H;
    let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
    if (ia > ta) { sw = img.naturalHeight * ta; sx = (img.naturalWidth - sw) / 2; }
    else { sh = img.naturalWidth / ta; sy = (img.naturalHeight - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
    ctx.restore();
  }

  const topGrad = ctx.createLinearGradient(0, 0, 0, 220);
  topGrad.addColorStop(0, 'rgba(15, 23, 42, 0.70)');
  topGrad.addColorStop(1, 'rgba(15, 23, 42, 0)');
  ctx.fillStyle = topGrad;
  ctx.fillRect(0, 0, W, 220);

  const botGrad = ctx.createLinearGradient(0, H - 380, 0, H);
  botGrad.addColorStop(0, 'rgba(15, 23, 42, 0)');
  botGrad.addColorStop(0.35, 'rgba(15, 23, 42, 0.75)');
  botGrad.addColorStop(0.75, 'rgba(15, 23, 42, 0.94)');
  botGrad.addColorStop(1, 'rgba(15, 23, 42, 0.98)');
  ctx.fillStyle = botGrad;
  ctx.fillRect(0, H - 380, W, 380);

  // Category Tag Pill
  ctx.save();
  ctx.fillStyle = '#FDD00B';
  const pillW = 310, pillH = 48, pillX = 48, pillY = 46, rad = 24;
  ctx.beginPath();
  ctx.roundRect(pillX, pillY, pillW, pillH, rad);
  ctx.fill();

  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(pillX + 24, pillY + 24, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#0f172a';
  ctx.font = '700 18px "IBM Plex Mono", monospace';
  ctx.fillText(item.category, pillX + 42, pillY + 31);
  ctx.restore();

  // Metric Badge
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.strokeStyle = 'rgba(253, 208, 11, 0.8)';
  ctx.lineWidth = 2.5;
  const mW = 250, mH = 48, mX = W - mW - 48, mY = 46;
  ctx.beginPath();
  ctx.roundRect(mX, mY, mW, mH, rad);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.font = '700 18px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(item.metric, mX + mW / 2, mY + 31);
  ctx.restore();

  // Title
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 52px "Inter Tight", sans-serif';
  ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
  ctx.shadowBlur = 12;
  ctx.fillText(item.title, 52, H - 120);
  ctx.shadowBlur = 0;

  // Description
  ctx.fillStyle = 'rgba(244, 241, 234, 0.92)';
  ctx.font = '400 24px "Inter Tight", sans-serif';
  ctx.fillText(item.desc.length > 70 ? item.desc.slice(0, 70) + '...' : item.desc, 52, H - 64);

  // Border
  ctx.strokeStyle = 'rgba(253, 208, 11, 0.45)';
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, W - 4, H - 4);
}

const cards = SERVICES.map((item, i) => {
  const cardCanvas = document.createElement('canvas');
  cardCanvas.width = 1400;
  cardCanvas.height = 880;
  const ctx = cardCanvas.getContext('2d');

  const img = new Image();
  img.crossOrigin = 'anonymous';

  const tex = new THREE.CanvasTexture(cardCanvas);
  tex.colorSpace = THREE.NoColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;

  const geo = new THREE.PlaneGeometry(1, 1, NX, NY);
  const mat = new THREE.ShaderMaterial({
    vertexShader: vs,
    fragmentShader: fs,
    transparent: true,
    side: THREE.DoubleSide,
    uniforms: {
      map: { value: tex },
      cover: { value: new THREE.Vector2(1, 1) },
      aspect: { value: CARD_W / CARD_H },
      ready: { value: 0 },
      radius: { value: 0.018 }
    }
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);

  const c = { i, item, title: item.title, tex, geo, mat, mesh, rect: null };

  img.onload = () => {
    drawServiceCardCanvas(ctx, img, item);
    tex.needsUpdate = true;
    mat.uniforms.ready.value = 1;
  };
  img.onerror = () => {
    drawServiceCardCanvas(ctx, null, item);
    tex.needsUpdate = true;
    mat.uniforms.ready.value = 1;
  };
  img.src = item.image;

  drawServiceCardCanvas(ctx, null, item);
  tex.needsUpdate = true;

  return c;
});

/* ---------- layout ---------- */
const GZ = 8;
let W = 1, H = 1, asp = 1, cols = 3, rows = 2, tanH = .3153, isMobile = false;
function resize() {
  W = innerWidth; H = innerHeight; asp = W / H;
  isMobile = asp < 0.85 || W < 768;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(W, H, false);
  camera.aspect = asp;
  if (isMobile) {
    camera.fov = 42;
    cols = 1;
    rows = 2;
  } else {
    camera.fov = asp < 16 / 9 ? Math.min(48, Math.atan(.561 / Math.max(asp, 0.72)) * 360 / Math.PI) : FOV;
    cols = 3;
    rows = 2;
  }
  camera.updateProjectionMatrix();
  tanH = Math.tan(camera.fov * Math.PI / 360);
  buildPath();
}
addEventListener('resize', resize); resize(); buildPath();

function grid(i) {
  const vh = 2 * GZ * tanH, vw = vh * asp;
  const aspectRatio = CARD_W / CARD_H;
  if (cols === 1) {
    const navbarPx = 68, buttonPx = 80, safeHPx = Math.max(300, H - navbarPx - buttonPx), gapPx = 16;
    let cwPx = Math.min(W - 32, 420), chPx = cwPx / aspectRatio, ghPx = chPx * 2 + gapPx;
    if (ghPx > safeHPx) { chPx = (safeHPx - gapPx) / 2; cwPx = chPx * aspectRatio; ghPx = safeHPx; }
    const gw = (cwPx / W) * vw, cw = gw, ch = (chPx / H) * vh, gap = (gapPx / H) * vh, gh = (ghPx / H) * vh;
    const centerOffsetPx = (buttonPx - navbarPx) / 2, safeCenterY = (centerOffsetPx / H) * vh;
    const r = i % 2;
    return { x: 0, y: safeCenterY + gh / 2 - ch / 2 - r * (ch + gap), w: cw, h: ch, vw, vh, c: 0, r };
  } else {
    const navbarPx = Math.max(90, H * 0.115), buttonPx = Math.max(96, H * 0.125), safeHPx = Math.max(380, H - navbarPx - buttonPx);
    const maxGwFromHeight = safeHPx / 0.44;
    const targetPx = Math.min(W - 64, 1380, maxGwFromHeight);
    const gw = (targetPx / W) * vw, gap = gw * 0.022, cw = (gw - gap * (cols - 1)) / cols, ch = cw / aspectRatio, gh = ch * rows + gap * 1.5 * (rows - 1);
    const c = i % cols, r = Math.floor(i / cols);
    const centerOffsetPx = (buttonPx - navbarPx) / 2, safeCenterY = (centerOffsetPx / H) * vh;
    return { x: -gw / 2 + cw / 2 + c * (cw + gap), y: safeCenterY + gh / 2 - ch / 2 - r * (ch + gap * 1.5), w: cw, h: ch, vw, vh, c, r };
  }
}

/* ---------- scroll ---------- */
let target = 0, p = 0, frozen = false;
const readScroll = () => { const t = $('track'); target = clamp(scrollY / (t.offsetHeight - innerHeight)); };
addEventListener('scroll', readScroll, {passive:true}); readScroll();

/* ---------- pose ---------- */
const op = new THREE.Vector3(), ot = new THREE.Vector3(), up = new THREE.Vector3(), Y = new THREE.Vector3(0, 1, 0), vp = new THREE.Vector3();
function poseRibbon(c, head) {
  const pos = c.geo.attributes.position, centre = head - c.i * STEP;
  for (let iy = 0; iy <= NY; iy++) for (let ix = 0; ix <= NX; ix++) {
    const k = iy * (NX + 1) + ix, lu = ix / NX - .5, lv = .5 - iy / NY;
    at(centre + lu * CARD_W, op, ot);
    up.copy(Y).addScaledVector(ot, -Y.dot(ot)).normalize();
    vp.copy(op).addScaledVector(up, lv * CARD_H);
    pos.setXYZ(k, vp.x, vp.y, vp.z);
  }
  pos.needsUpdate = true;
}
function poseGrid(c, q) {
  const g = grid(c.i), pos = c.geo.attributes.position;
  const dx = (g.c - (cols - 1) / 2) * 1.2 + (cols === 3 && g.c === 1 ? 0 : 0), dy = g.r < rows / 2 ? 1 : -1;
  const ox = dx * g.vw * .62 * (1 - q), oy = dy * g.vh * (g.c === 1 ? .95 : .34) * (1 - q), tilt = (1 - q) * .22 * (g.c - 1 || .5) * dy;
  const cs = Math.cos(tilt), sn = Math.sin(tilt);
  for (let iy = 0; iy <= NY; iy++) for (let ix = 0; ix <= NX; ix++) {
    const k = iy * (NX + 1) + ix, x = (ix / NX - .5) * g.w, y = (.5 - iy / NY) * g.h;
    pos.setXYZ(k, g.x + ox + x * cs - y * sn, g.y + oy + x * sn + y * cs, -GZ - (1 - q) * .6 * Math.sin(ix / NX * Math.PI));
  }
  pos.needsUpdate = true;
  c.rect = g;
}

const RIB_A = .14, RIB_B = .63;
function render() {
  const pp = p;
  const rise = 1 - out(span(pp, 0, .12));
  const run = mix(-50, 76, span(pp, 0, .58));
  const hlFade = 1 - span(pp, 0.52, 0.62);
  const riseOffset = isMobile ? rise * 5 : rise * 8;
  $('l1').style.transform = `translate3d(${run}vw,${riseOffset}vh,0)`;
  $('l1').style.opacity = hlFade;
  $('l2').style.transform = `translate3d(${-run}vw,${riseOffset}vh,0)`;
  $('l2').style.opacity = hlFade;
  const capA = 1 - span(pp, .52, .57);
  $('cap').style.opacity = capA; $('cap').style.transform = `translate(-50%,calc(-50% + ${riseOffset}vh))`;
  $('rule').style.transform = `scaleX(${ease(span(pp, .72, .86))})`;
  $('rule').style.top = isMobile ? '45%' : '48%';

  const pr = span(pp, RIB_A, RIB_B), head = mix(0, PATH_L + cards.length * STEP, pr);
  for (const c of cards) {
    const s = head - c.i * STEP, end = PATH_L - CARD_W;
    if (s < end) {
      c.mesh.visible = s > CARD_W; c.rect = null;
      if (c.mesh.visible) poseRibbon(c, head);
    } else if (c.i < cols * rows) {
      const st = mix(RIB_A, RIB_B, (end + c.i * STEP) / (PATH_L + cards.length * STEP)), q = out(span(pp, st, st + .13));
      c.mesh.visible = q > .001;
      if (c.mesh.visible) poseGrid(c, q);
    } else { c.mesh.visible = false; c.rect = null; }
  }
  renderer.render(scene, camera);
}

/* ---------- hover & click interactions ---------- */
const nameEl = $('name');
let hoveredCard = null;

$('stage').addEventListener('pointermove', e => {
  let hit = null;
  if (p > .86) {
    const nx = (e.clientX / W - .5), ny = (.5 - e.clientY / H);
    for (const c of cards) {
      const g = c.rect;
      if (!g) continue;
      const x = nx * g.vw, y = ny * g.vh;
      if (Math.abs(x - g.x) < g.w / 2 && Math.abs(y - g.y) < g.h / 2) hit = c;
    }
  }
  hoveredCard = hit;
  nameEl.style.opacity = hit ? 1 : 0;
  if (hit) {
    nameEl.innerHTML = `<span>${hit.item.title}</span><span class="name-metric">${hit.item.metric}</span>`;
    nameEl.style.transform = `translate(${e.clientX + 14}px,${e.clientY + 16}px)`;
    $('stage').style.cursor = 'pointer';
  } else {
    $('stage').style.cursor = 'default';
  }
});

function openServiceModal(item) {
  $('modalTag').textContent = item.category;
  $('modalTitle').textContent = item.title;
  $('modalDesc').textContent = item.desc;
  const delivContainer = $('modalDeliverables');
  delivContainer.innerHTML = '';
  (item.deliverables || []).forEach(d => {
    const el = document.createElement('div');
    el.className = 'modal-deliverable-item';
    el.textContent = d;
    delivContainer.appendChild(el);
  });
  $('serviceModal').classList.add('open');
}

$('stage').addEventListener('click', e => {
  if (hoveredCard) {
    openServiceModal(hoveredCard.item);
  }
});

$('modalClose').addEventListener('click', () => {
  $('serviceModal').classList.remove('open');
});
$('serviceModal').addEventListener('click', e => {
  if (e.target === $('serviceModal')) $('serviceModal').classList.remove('open');
});
$('modalActionBtn').addEventListener('click', () => {
  $('serviceModal').classList.remove('open');
  window.location.href = '/#booking';
});

/* ---------- loop ---------- */
function loop() {
  if (!frozen) {
    p += (target - p) * .08;
    if (Math.abs(target - p) < .00005) p = target;
    render();
  }
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
