<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grow Big — Case Studies in Motion</title>
  <meta name="description" content="A studio portfolio where a continuous 3D ribbon of real client case studies sweeps through space, then lands in a calm 3x2 grid.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --ink: #0a0a0b;
      --brand-blue: #3d6ab3;
      --brand-yellow: #fdcf09;
      --brand-navy: #03063A;
      --line: rgba(61, 106, 179, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    #track { height: 180vh; background: #ffffff; }
    .stage {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #ffffff;
      user-select: none;
    }
    .hl {
      position: absolute;
      left: 0;
      right: 0;
      font-weight: 600;
      font-size: clamp(40px, 6.7vw, 130px);
      line-height: 1;
      letter-spacing: -0.055em;
      white-space: nowrap;
      text-align: center;
      will-change: transform;
      color: #0a0a0b;
      z-index: 2;
    }
    #l1 { top: calc(50% - 0.98em); }
    #l2 { top: calc(50% + 0.03em); }
    #l1 span, #l2 span { display: inline-block; }
    #l1 span { margin-right: 15vw; }
    #l2 span { margin-left: 15vw; }
    #cap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 22em;
      text-align: center;
      font-size: clamp(9px, 0.74vw, 13px);
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #334155;
      z-index: 2;
    }
    #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #rule {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(calc(100% - 64px), 1296px);
      height: 1px;
      background: var(--line);
      transform-origin: center;
      transform: translateX(-50%) scaleX(0);
      pointer-events: none;
      z-index: 2;
    }

    /* "View More" CTA at the Bottom of Landed Grid */
    #viewMoreWrap {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s ease;
    }
    .view-more-btn {
      height: 52px;
      padding: 0 6px 0 24px;
      background: linear-gradient(135deg, #3d6ab3 0%, #1e4587 100%);
      color: #ffffff;
      border: 1px solid rgba(253, 207, 9, 0.5);
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 10px 28px rgba(61, 106, 179, 0.35), 0 0 14px rgba(253, 207, 9, 0.15);
      transition: all 0.25s ease;
    }
    .view-more-btn:hover {
      background: linear-gradient(135deg, #2a589e 0%, #163669 100%);
      border-color: rgba(253, 207, 9, 0.95);
      box-shadow: 0 14px 36px rgba(61, 106, 179, 0.45), 0 0 20px rgba(253, 207, 9, 0.3);
      transform: translateY(-2px);
    }
    .view-more-arrow {
      width: 40px;
      height: 40px;
      background: #fdcf09;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .view-more-arrow svg {
      width: 18px;
      height: 18px;
      stroke: #03063A;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .view-more-btn:hover .view-more-arrow {
      transform: translateX(2px);
    }

    @media (max-width: 760px) {
      #viewMoreWrap { bottom: 16px; }
      .view-more-btn {
        height: 46px;
        padding: 0 5px 0 18px;
        font-size: 13.5px;
        gap: 12px;
      }
      .view-more-arrow { width: 34px; height: 34px; }
      .view-more-arrow svg { width: 15px; height: 15px; }
    }
  </style>
</head>
<body>

<div id="track">
  <main class="stage" id="stage">
    <h1 aria-label="Growth in motion">
      <div class="hl" id="l1" aria-hidden="true"><span>GROWTH IN</span></div>
      <div class="hl" id="l2" aria-hidden="true"><span>MOTION</span></div>
    </h1>
    <div id="cap">Scaling high-growth brands through data-driven performance.</div>
    <div id="rule"></div>
    <canvas id="gl"></canvas>

    <!-- "View More" Button (Appears IMMEDIATELY as Cards Center in the Grid) -->
    <div id="viewMoreWrap">
      <a href="/#portfolio" class="view-more-btn">
        <span>View More Case Studies</span>
        <span class="view-more-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14" />
            <path d="M12 5l7 7-7 7" />
          </svg>
        </span>
      </a>
    </div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';

const CASE_ITEMS = [
  {
    heading: 'Ageaon Infrastructure',
    desc: 'Scalable cloud infrastructure & automated CI/CD pipeline.',
    image: 'case study.png',
  },
  {
    heading: 'Choicezz Marketplace',
    desc: 'AI recommendation engine with instant friction-free checkout.',
    image: 'case study (2).png',
  },
  {
    heading: 'Vasishta Luxury Events',
    desc: 'Interactive booking visualizer with automated lead routing.',
    image: 'case study (3).png',
  },
  {
    heading: 'Corebridge HR Cloud',
    desc: 'Intelligent HR management automation & payroll tracking.',
    image: 'case study (4).png',
  },
  {
    heading: 'Pragathi Mahavidyalaya',
    desc: 'Integrated campus portal & real-time academic analytics.',
    image: 'case study (5).png',
  },
  {
    heading: 'Medsurgy Health AI',
    desc: 'Live ICU bed management & electronic health records suite.',
    image: 'case study (6).png',
  },
  {
    heading: 'Luminary Living D2C',
    desc: 'High-velocity creative testing & dynamic bundle funnels.',
    image: 'case study (7).png',
  },
  {
    heading: 'ApexPay Technologies',
    desc: 'Outbound AI engine & LinkedIn/Google multi-touch ABM funnels.',
    image: 'case study (8).png',
  },
];

const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const out = t => 1 - (1 - t) ** 3;
const span = (p, a, b) => clamp((p - a) / (b - a));

/* ---------- renderer ---------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setClearColor(0xffffff, 0);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const scene = new THREE.Scene();
const FOV = 35, camera = new THREE.PerspectiveCamera(FOV, 1, .1, 100);

/* ---------- ribbon path ---------- */
let path, PATH_L = 1;
const SAMPLES = 1200, pathP = [], pathT = [];
const PH0 = -1.5, PH1 = Math.PI * 2 + 1.35;
function buildPath() {
  const pts = [];
  for (let i = 0; i <= 160; i++) {
    const t = i / 160, ph = mix(PH0, PH1, t), cs = Math.cos(ph), u = 2 * t - 1;
    const depth = cs > 0 ? 7.6 + 16.4 * cs ** .9 : 7.6 + 2.2 * cs;
    const edge = .84 + .5 * span(.14 - t, 0, .14) + .8 * span(t, .84, 1);
    pts.push(new THREE.Vector3(edge * Math.sin(ph) * depth * .561, .5 * Math.sign(u) * Math.abs(u) ** 1.4 * depth * .63, -depth));
  }
  path = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  path.arcLengthDivisions = 1500;
  PATH_L = path.getLength(); pathP.length = pathT.length = 0;
  for (let i = 0; i <= SAMPLES; i++) { const u = i / SAMPLES; pathP.push(path.getPointAt(u)); pathT.push(path.getTangentAt(u)); }
}
const at = (s, op, ot) => {
  const f = clamp(s / PATH_L) * SAMPLES, i = Math.min(SAMPLES - 1, Math.floor(f)), k = f - i;
  op.lerpVectors(pathP[i], pathP[i + 1], k); ot.lerpVectors(pathT[i], pathT[i + 1], k).normalize();
};

/* ---------- card shader & cards ---------- */
const CARD_W = 2.45, CARD_H = 1.58, GAP = .04, STEP = CARD_W + GAP, NX = 28, NY = 3;
const vs = `varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const fs = `uniform sampler2D map;uniform vec2 cover;uniform float aspect,ready,radius;varying vec2 vUv;
void main(){
  vec2 q=(abs(vUv-.5)-.5)*vec2(aspect,1.)+radius;
  float d=length(max(q,0.))+min(max(q.x,q.y),0.)-radius;
  float px=fwidth(d),a=1.-smoothstep(-px,px,d);
  if(a<.01)discard;
  vec2 uv=vUv;if(!gl_FrontFacing)uv.x=1.-uv.x;
  vec3 c=mix(vec3(0.98),texture2D(map,(uv-.5)*cover+.5).rgb,ready);
  float edge=smoothstep(-.014-px,-.014,d);
  gl_FragColor=vec4(mix(c,vec3(0.05,0.12,0.28),edge*.20),a);
}`;

function renderCardCanvas(ctx, img, item) {
  const W = 1535, H = 1024;
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    const imgAspect = img.naturalWidth / img.naturalHeight;
    const targetAspect = W / H;
    let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
    if (imgAspect > targetAspect) {
      sw = img.naturalHeight * targetAspect;
      sx = (img.naturalWidth - sw) / 2;
    } else {
      sh = img.naturalWidth / targetAspect;
      sy = (img.naturalHeight - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
    ctx.restore();
  } else {
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#03063A');
    grad.addColorStop(0.5, '#1e3b6e');
    grad.addColorStop(1, '#0f172a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  const overlayH = 260;
  const overlayGrad = ctx.createLinearGradient(0, H - overlayH, 0, H);
  overlayGrad.addColorStop(0, 'rgba(3, 6, 58, 0)');
  overlayGrad.addColorStop(0.3, 'rgba(3, 6, 58, 0.70)');
  overlayGrad.addColorStop(0.7, 'rgba(3, 6, 58, 0.92)');
  overlayGrad.addColorStop(1, 'rgba(3, 6, 58, 0.98)');
  ctx.fillStyle = overlayGrad;
  ctx.fillRect(0, H - overlayH, W, overlayH);

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 58px "Inter Tight", sans-serif';
  ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
  ctx.shadowBlur = 10;
  ctx.fillText(item.heading, 56, H - 128);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(244, 241, 234, 0.92)';
  ctx.font = '500 32px "Inter Tight", sans-serif';
  ctx.fillText(item.desc, 56, H - 64);

  ctx.strokeStyle = 'rgba(61, 106, 179, 0.35)';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, W - 3, H - 3);
}

const cards = CASE_ITEMS.map((item, i) => {
  const cardCanvas = document.createElement('canvas');
  cardCanvas.width = 1535;
  cardCanvas.height = 1024;
  const ctx = cardCanvas.getContext('2d');

  renderCardCanvas(ctx, null, item);

  const tex = new THREE.CanvasTexture(cardCanvas);
  tex.colorSpace = THREE.NoColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = item.image;
  img.onload = () => {
    renderCardCanvas(ctx, img, item);
    tex.needsUpdate = true;
  };

  const geo = new THREE.PlaneGeometry(1, 1, NX, NY);
  const mat = new THREE.ShaderMaterial({
    vertexShader: vs,
    fragmentShader: fs,
    transparent: true,
    side: THREE.DoubleSide,
    uniforms: {
      map: { value: tex },
      cover: { value: new THREE.Vector2(1, 1) },
      aspect: { value: CARD_W / CARD_H },
      ready: { value: 1 },
      radius: { value: 0.024 },
    },
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);

  return { i, item, tex, geo, mat, mesh, rect: null };
});

/* ---------- layout (Fills Full Width Symmetrically) ---------- */
const GZ = 7.8;
let W = 1, H = 1, asp = 1, cols = 3, rows = 2, tanH = .3153;
function resize() {
  W = innerWidth; H = innerHeight; asp = W / H;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(W, H, false);
  camera.aspect = asp; camera.fov = asp < 16 / 9 ? Math.atan(.561 / asp) * 360 / Math.PI : FOV; camera.updateProjectionMatrix();
  tanH = Math.tan(camera.fov * Math.PI / 360);
  cols = asp < .9 ? 2 : 3; rows = asp < .9 ? 3 : 2;
}
addEventListener('resize', resize); resize(); buildPath();

function grid(i) {
  const vh = 2 * GZ * tanH, vw = vh * asp;
  // Symmetrically align the 3x2 card grid with the centered Navbar header:
  // Header has maxWidth: 1360px with padding: 0 2rem (32px left/right), giving an inner content span of min(W - 64, 1296)px
  const targetPixelWidth = cols === 3 ? Math.min(W - 64, 1296) : Math.min(W - 48, 860);
  const gw = (targetPixelWidth / W) * vw;
  const gap = cols === 3 ? gw * 0.024 : gw * 0.03;
  let cw = (gw - gap * (cols - 1)) / cols;
  let ch = cw / (CARD_W / CARD_H);
  let gh = ch * rows + gap * 1.35 * (rows - 1);

  if (gh > vh * 0.70) {
    const scale = (vh * 0.70) / gh;
    cw *= scale;
    ch *= scale;
    gh *= scale;
  }

  const c = i % cols, r = Math.floor(i / cols);
  return {
    x: -gw / 2 + cw / 2 + c * (cw + gap),
    y: gh / 2 - ch / 2 - r * (ch + gap * 1.35),
    w: cw,
    h: ch,
    vw,
    vh,
    c,
    r
  };
}

/* ---------- scroll ---------- */
let target = 0, p = 0;
const readScroll = () => {
  const t = $('track');
  target = clamp(scrollY / (t.offsetHeight - innerHeight));
};
addEventListener('scroll', readScroll, {passive:true}); readScroll();

/* ---------- pose ---------- */
const op = new THREE.Vector3(), ot = new THREE.Vector3(), up = new THREE.Vector3(), Y = new THREE.Vector3(0, 1, 0), vp = new THREE.Vector3();
function poseRibbon(c, head) {
  const pos = c.geo.attributes.position, centre = head - c.i * STEP;
  for (let iy = 0; iy <= NY; iy++) for (let ix = 0; ix <= NX; ix++) {
    const k = iy * (NX + 1) + ix, lu = ix / NX - .5, lv = .5 - iy / NY;
    at(centre + lu * CARD_W, op, ot);
    up.copy(Y).addScaledVector(ot, -Y.dot(ot)).normalize();
    vp.copy(op).addScaledVector(up, lv * CARD_H);
    pos.setXYZ(k, vp.x, vp.y, vp.z);
  }
  pos.needsUpdate = true;
}

function poseGrid(c, q) {
  const g = grid(c.i), pos = c.geo.attributes.position;
  const dx = (g.c - (cols - 1) / 2) * 1.2 + (cols === 3 && g.c === 1 ? 0 : 0), dy = g.r < rows / 2 ? 1 : -1;
  const ox = dx * g.vw * 0.62 * (1 - q), oy = dy * g.vh * (g.c === 1 ? 0.95 : 0.34) * (1 - q), tilt = (1 - q) * 0.22 * (g.c - 1 || 0.5) * dy;
  const cs = Math.cos(tilt), sn = Math.sin(tilt);
  for (let iy = 0; iy <= NY; iy++) for (let ix = 0; ix <= NX; ix++) {
    const k = iy * (NX + 1) + ix, x = (ix / NX - 0.5) * g.w, y = (.5 - iy / NY) * g.h;
    pos.setXYZ(k, g.x + ox + x * cs - y * sn, g.y + oy + x * sn + y * cs, -GZ - (1 - q) * 0.6 * Math.sin(ix / NX * Math.PI));
  }
  pos.needsUpdate = true;
  c.rect = g;
}

const RIB_A = 0.0, RIB_B = 0.60;
const viewMoreWrap = $('viewMoreWrap');

function render() {
  const pp = p;
  // No huge downward gap - headline starts in place and slides horizontally
  const run = mix(-12, 60, span(pp, 0, 0.38));
  $('l1').style.transform = `translate3d(${run}vw,0,0)`;
  $('l2').style.transform = `translate3d(${-run}vw,0,0)`;
  const capA = 1 - span(pp, 0.30, 0.44);
  $('cap').style.opacity = capA; $('cap').style.transform = `translate(-50%, -50%)`;

  $('rule').style.transform = `translateX(-50%) scaleX(${ease(span(pp, 0.58, 0.74))})`;
  $('rule').style.top = '50%';

  // Button appears smoothly as cards land in grid (pp = 0.64 - 0.76)
  const viewMoreOpacity = span(pp, 0.64, 0.76);
  const easedBtn = ease(viewMoreOpacity);
  viewMoreWrap.style.opacity = easedBtn;
  viewMoreWrap.style.pointerEvents = viewMoreOpacity > 0.4 ? 'auto' : 'none';
  viewMoreWrap.style.transform = `translate(-50%, ${(1 - easedBtn) * 14}px)`;

  const pr = span(pp, RIB_A, RIB_B), head = mix(0, PATH_L + cards.length * STEP, pr);
  for (const c of cards) {
    const s = head - c.i * STEP, end = PATH_L - CARD_W;
    if (s < end) {
      c.mesh.visible = s > CARD_W * 0.4; c.rect = null;
      if (c.mesh.visible) poseRibbon(c, head);
    } else if (c.i < cols * rows) {
      const st = mix(RIB_A, RIB_B, (end + c.i * STEP) / (PATH_L + cards.length * STEP)), q = out(span(pp, st, st + 0.14));
      c.mesh.visible = q > 0.001;
      if (c.mesh.visible) poseGrid(c, q);
    } else { c.mesh.visible = false; c.rect = null; }
  }
  renderer.render(scene, camera);
}

/* ---------- loop (instant responsive tracking) ---------- */
function loop() {
  p += (target - p) * 0.25;
  if (Math.abs(target - p) < 0.0001) p = target;
  render();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
